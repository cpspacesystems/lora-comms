[package]
name = "lora-comms"
version = "0.1.0"
edition = "2024"
default-run = "main"

[dependencies]
crc = "3.3.0"
flatbuffers = { version = "25.12.19", features = ["serialize"] }
oorandom = "11.1.5"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros"] }
zenoh = "1.6.2"
bitint = "0.1.1"
tism = { git = "https://github.com/cpspacesystems/tism", version = "0.1.0" }
hex = "0.4.3"
toml = "1.1.2"
serde = { version = "1.0.228", features = ["serde_derive"] }
by_address = "1.2.1"

[lints.rust]
dead_code = "allow"
unused_imports = "allow"

[features]
default = [ "simulation", "hardware_attached_full_system" ]
simulation = []
hardware_attached_full_system = []

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "ground"
path = "src/ground.rs"
